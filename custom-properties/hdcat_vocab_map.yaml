# hdcat_vocab_map.yaml
# Maps the enum codes created by om_hdcat_setup.py to the URIs the HealthDCAT-AP exporter emits.
# Entries marked "TODO" must be confirmed against the published vocabularies before you publish
# (HealthDCAT-AP Release 7: https://healthdataeu.pages.code.europa.eu/healthdcat-ap/releases/release-7/).

namespaces:
  healthdcatap: "http://healthdataportal.eu/ns/health#"   # TODO: R7 prefix table and property URIs differ (w3id.org/healthdcatap#) - confirm
  dcatap: "http://data.europa.eu/r5r/"
  dpv: "https://w3id.org/dpv#"
  eu-gdpr: "https://w3id.org/dpv/legal/eu/gdpr#"

hdcatAccessRights:
  PUBLIC: "http://publications.europa.eu/resource/authority/access-right/PUBLIC"
  RESTRICTED: "http://publications.europa.eu/resource/authority/access-right/RESTRICTED"
  NON_PUBLIC: "http://publications.europa.eu/resource/authority/access-right/NON_PUBLIC"

hdcatApplicableLegislation:
  UK_GDPR: "http://www.legislation.gov.uk/eur/2016/679"
  DPA_2018: "http://www.legislation.gov.uk/id/ukpga/2018/12"
  DEA_2017: "http://www.legislation.gov.uk/id/ukpga/2017/30"
  COPI_2002: "http://www.legislation.gov.uk/id/uksi/2002/1438"
  EHDS: "http://data.europa.eu/eli/reg/2025/327/oj"

hdcatLegalBasis:            # DPV GDPR legal bases
  GDPR_6_1_A: "eu-gdpr:A6-1-a"
  GDPR_6_1_C: "eu-gdpr:A6-1-c"
  GDPR_6_1_E: "eu-gdpr:A6-1-e"
  GDPR_6_1_F: "eu-gdpr:A6-1-f"
  GDPR_9_2_A: "eu-gdpr:A9-2-a"
  GDPR_9_2_H: "eu-gdpr:A9-2-h"
  GDPR_9_2_I: "eu-gdpr:A9-2-i"
  GDPR_9_2_J: "eu-gdpr:A9-2-j"

