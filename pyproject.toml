[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sailx"
version = "0.1.0"
description = "SAIL Data Explorer: LLM-driven metadata discovery and governed text-to-SQL over OpenMetadata"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28.1",
    "openai>=1.40",
    "sqlglot>=25",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "pyjwt[crypto]>=2.13",
    "pyyaml>=6",
    "httpx>=0.27",
    "plotly>=5.20",
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "pydantic>=2.7",
]

[project.optional-dependencies]
ui = ["chainlit>=2.12", "requests>=2.31"]
db2 = ["ibm_db>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sailx-sql-mcp = "sailx.sql.server:main"
sailx-phenotype-mcp = "sailx.phenotype.server:main"
sailx-catalog-mcp = "sailx.catalog.server:main"
sailx-agent-api = "sailx.agent.api:main"

[tool.setuptools.packages.find]
include = ["sailx*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
